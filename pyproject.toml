[project]
name = "interview-prep"
version = "0.1.0"
description = "AI interview prep: research the company, then run an adaptive, graded mock interview."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
]
